name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Test Suite
        run: dotnet test Il2CppDumperEx.sln -c Release --nologo

      - name: Publish Single-File Executable
        run: |
          dotnet publish src/Il2CppDumperEx/Il2CppDumperEx.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish `
            --nologo

      - name: Generate Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path publish/Il2CppDumperEx.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Il2CppDumperEx.exe" | Out-File -FilePath publish/Il2CppDumperEx.exe.sha256 -Encoding utf8NoBOM

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Il2CppDumperEx (Latest Build)"
          body: |
            Automated continuous release from commit ${{ github.sha }}.
            
            ### Download
            - **`Il2CppDumperEx.exe`**: Standalone single-file Windows x64 executable.
            
            *Requires [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0).*
          files: |
            publish/Il2CppDumperEx.exe
            publish/Il2CppDumperEx.exe.sha256
          draft: false
          prerelease: false
