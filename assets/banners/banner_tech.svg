<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#1E1E24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="880" height="96" rx="8" fill="#16161A" stroke="#2D2D36" stroke-width="1" />
  <rect x="1" y="1" width="878" height="94" rx="7" fill="url(#techGrad)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="12" width="5" height="72" rx="2.5" fill="#8B5CF6" filter="url(#glowPurple)" />

  <!-- Icon Container -->
  <rect x="24" y="20" width="56" height="56" rx="10" fill="#1E1E26" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.6" />
  <!-- Microscope / Science Icon -->
  <g transform="translate(36, 29)">
    <path d="M 6 29 L 26 29" stroke="#A855F7" stroke-width="2" stroke-linecap="round" />
    <path d="M 12 29 L 12 23 C 12 20 14 18 17 18 L 22 18" stroke="#A855F7" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 18 4 L 26 12" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 14 8 L 22 16" stroke="#E9D5FF" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="21" cy="7" r="2.5" fill="#C084FC" />
    <line x1="8" y1="21" x2="16" y2="21" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Titles -->
  <text x="96" y="44" fill="#F4F4F5" font-size="18" font-weight="700" letter-spacing="1">DEEP-DIVE TECHNICAL CAPABILITIES</text>
  <text x="96" y="66" fill="#94A3B8" font-size="12" font-weight="400">Memory map reconstruction • NEP2 cipher • Zstandard/LZ4 • SElf unpacker • Shannon entropy</text>

  <!-- Tag Pill -->
  <rect x="736" y="32" width="120" height="28" rx="14" fill="#3B0764" stroke="#8B5CF6" stroke-width="1" />
  <circle cx="752" cy="46" r="3.5" fill="#C084FC" />
  <text x="764" y="50" fill="#E2E8F0" font-size="11" font-weight="600" letter-spacing="0.5">INTERNALS</text>

  <!-- Bottom Accent Highlight -->
  <rect x="96" y="80" width="600" height="2" fill="url(#purpleLine)" rx="1" />
</svg>
