<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="disasmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1E1E24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="880" height="96" rx="8" fill="#16161A" stroke="#2D2D36" stroke-width="1" />
  <rect x="1" y="1" width="878" height="94" rx="7" fill="url(#disasmGrad)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="12" width="5" height="72" rx="2.5" fill="#06B6D4" filter="url(#glowCyan)" />

  <!-- Icon Container -->
  <rect x="24" y="20" width="56" height="56" rx="10" fill="#1E1E26" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.6" />
  <!-- Disassembler / Code Tree Icon -->
  <g transform="translate(36, 30)">
    <circle cx="6" cy="8" r="3" fill="#67E8F9" />
    <circle cx="26" cy="6" r="3" fill="#22D3EE" />
    <circle cx="26" cy="26" r="3" fill="#06B6D4" />
    <circle cx="16" cy="18" r="2.5" fill="#0891B2" />
    <path d="M 6 8 L 16 18 M 16 18 L 26 6 M 16 18 L 26 26" stroke="#A5F3FC" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Titles -->
  <text x="96" y="44" fill="#F4F4F5" font-size="18" font-weight="700" letter-spacing="1">DISASSEMBLER &amp; DECOMPILER INTEGRATION</text>
  <text x="96" y="66" fill="#94A3B8" font-size="12" font-weight="400">IDA Pro (ida_dirtree) • Ghidra (Namespaces &amp; C-Parser) • Binary Ninja (Components)</text>

  <!-- Tag Pill -->
  <rect x="736" y="32" width="120" height="28" rx="14" fill="#164E63" stroke="#06B6D4" stroke-width="1" />
  <circle cx="752" cy="46" r="3.5" fill="#67E8F9" />
  <text x="764" y="50" fill="#E2E8F0" font-size="11" font-weight="600" letter-spacing="0.5">TOOLING</text>

  <!-- Bottom Accent Highlight -->
  <rect x="96" y="80" width="600" height="2" fill="url(#cyanLine)" rx="1" />
</svg>
