<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="formatsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1E1E24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="amberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="880" height="96" rx="8" fill="#16161A" stroke="#2D2D36" stroke-width="1" />
  <rect x="1" y="1" width="878" height="94" rx="7" fill="url(#formatsGrad)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="12" width="5" height="72" rx="2.5" fill="#F59E0B" filter="url(#glowAmber)" />

  <!-- Icon Container -->
  <rect x="24" y="20" width="56" height="56" rx="10" fill="#1E1E26" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.6" />
  <!-- Package Box Icon -->
  <g transform="translate(36, 30)">
    <path d="M 16 2 L 30 9 L 16 16 L 2 9 Z" fill="none" stroke="#FCD34D" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 2 9 L 2 24 L 16 31 L 16 16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 30 9 L 30 24 L 16 31 L 16 16" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round" />
    <line x1="8.5" y1="5.5" x2="22.5" y2="12.5" stroke="#FDE68A" stroke-width="1.2" />
  </g>

  <!-- Titles -->
  <text x="96" y="44" fill="#F4F4F5" font-size="18" font-weight="700" letter-spacing="1">SUPPORTED FORMATS, ARCHIVES &amp; PLATFORMS</text>
  <text x="96" y="66" fill="#94A3B8" font-size="12" font-weight="400">PC • Android (APK/AAB) • iOS (IPA) • Nintendo Switch (NSO) • PlayStation (SElf) • Memory Maps</text>

  <!-- Tag Pill -->
  <rect x="736" y="32" width="120" height="28" rx="14" fill="#451A03" stroke="#F59E0B" stroke-width="1" />
  <circle cx="752" cy="46" r="3.5" fill="#FBBF24" />
  <text x="764" y="50" fill="#E2E8F0" font-size="11" font-weight="600" letter-spacing="0.5">COMPATIBILITY</text>

  <!-- Bottom Accent Highlight -->
  <rect x="96" y="80" width="600" height="2" fill="url(#amberLine)" rx="1" />
</svg>
