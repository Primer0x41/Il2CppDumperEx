<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 96" width="880" height="96" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1E1E24" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="greenLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="0" y="0" width="880" height="96" rx="8" fill="#16161A" stroke="#2D2D36" stroke-width="1" />
  <rect x="1" y="1" width="878" height="94" rx="7" fill="url(#cliGrad)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="12" width="5" height="72" rx="2.5" fill="#10B981" filter="url(#glowGreen)" />

  <!-- Icon Container -->
  <rect x="24" y="20" width="56" height="56" rx="10" fill="#1E1E26" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" />
  <!-- Terminal Prompt Icon -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="32" height="26" rx="3" fill="none" stroke="#34D399" stroke-width="2" />
    <path d="M 6 9 L 12 14 L 6 19" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="16" y1="19" x2="25" y2="19" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Titles -->
  <text x="96" y="44" fill="#F4F4F5" font-size="18" font-weight="700" letter-spacing="1">COMMAND-LINE INTERFACE (CLI)</text>
  <text x="96" y="66" fill="#94A3B8" font-size="12" font-weight="400">Headless operation • Automated script recipes • CI/CD batch processing</text>

  <!-- Tag Pill -->
  <rect x="736" y="32" width="120" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1" />
  <circle cx="752" cy="46" r="3.5" fill="#34D399" />
  <text x="764" y="50" fill="#E2E8F0" font-size="11" font-weight="600" letter-spacing="0.5">AUTOMATION</text>

  <!-- Bottom Accent Highlight -->
  <rect x="96" y="80" width="600" height="2" fill="url(#greenLine)" rx="1" />
</svg>
